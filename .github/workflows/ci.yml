# Build check and the model-free unit tests on a GitHub Windows runner. No GPU there: OpenCL.dll and
# ze_loader.dll are loaded at run time, so everything builds, and only the tests that need neither a GPU nor a
# model run (the GPU and model checks stay in tests\run_tests.ps1 on a real Intel Arc machine).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5  # (v5: Node.js 24; v4 ran on the deprecated Node.js 20)
      - name: Build
        shell: powershell
        run: |
          .\build.ps1 tools\clinfo.cpp zero\serverz.cpp zero\runz.cpp tools\ref_forward.cpp `
            zero\transcribez.cpp tools\ref_whisper.cpp tools\zero_recorder.cpp `
            tests\test_http.cpp tests\test_api_compat.cpp tests\test_web_tools.cpp tests\test_xcache_pools.cpp `
            tests\test_json.cpp tests\test_sampler.cpp tests\test_gguf_pack.cpp tests\test_quant_rows.cpp `
            tests\test_hc.cpp tests\test_fa.cpp tests\test_route.cpp tests\test_chat_store.cpp tests\test_doc_read.cpp `
            tests\test_office.cpp tests\test_pdf_scan.cpp tests\test_audio.cpp tests\test_pbkdf2.cpp `
            tests\test_autoround_blocks.cpp tests\test_expert_layout.cpp tests\test_autoround_revision.cpp
      - name: Unit tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = [ordered]@{
            'test_http'         = 'test_http: all passed'
            'test_api_compat'   = 'all passed'
            'test_web_tools'    = 'test_web_tools: all passed'
            'test_xcache_pools' = 'ALL OK'
            'test_json'         = 'test_json: all passed'
            'test_sampler'      = 'ALL OK'
            'test_quant_rows'   = 'test_quant_rows: all passed'
            'test_chat_store'   = 'test_chat_store: all passed'
            'test_doc_read'     = 'test_doc_read: all passed'
            'test_office'       = 'test_office: all passed'
            'test_pdf_scan'     = 'test_pdf_scan: all passed'
            'test_audio'        = 'test_audio: all passed'
            'test_pbkdf2'       = 'test_pbkdf2: all passed'
            'test_autoround_blocks' = 'PASS: '
            'test_expert_layout' = 'expert-file fields checked'
            'test_autoround_revision' = 'checks passed'
          }
          $failed = 0
          foreach ($t in $tests.Keys) {
            # (5.1 makes a redirected stderr line a terminating error under 'Stop': each test runs under Continue)
            $ErrorActionPreference = 'Continue'
            $o = & ".\bin\$t.exe" 2>&1 | Out-String
            $ErrorActionPreference = 'Stop'
            if ($LASTEXITCODE -eq 0 -and $o.Contains($tests[$t])) { Write-Host "PASS $t" }
            elseif ($LASTEXITCODE -eq -1073741515) { Write-Host "SKIP $t (a system DLL missing on this image: Media Foundation)" }
            else { Write-Host "FAIL $t (exit $LASTEXITCODE)"; Write-Host $o; $failed++ }
          }
          if ($failed) { throw "$failed unit test(s) failed" }
  linux-file-reads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Linux expert read fallback (no GPU)
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined tests/test_platform_read.cpp -o /tmp/test_platform_read
          /tmp/test_platform_read
  # The Linux package (scripts/make-package-linux.sh) on the oldest Ubuntu it is for, so its programs run on 24.04
  # and newer; no GPU here, so only what needs none runs: the programs start, the launcher's catalog matches the
  # Windows one, its system check reports what is missing instead of failing.
  linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and package
        shell: bash
        run: |
          bash scripts/make-package-linux.sh
          ls -l dist/*.tar.gz
      - name: Checks without a GPU
        shell: bash  # (bash -eo pipefail: without it a crashing binary piped into head would still pass)
        run: |
          set -e
          pkg=$(ls -d dist/inferzero-*-linux-x64 | head -1)
          "$pkg/bin/serverz" --help | head -3
          "$pkg/bin/runz" --help | head -3
          python3 tests/check_catalog_sync.py
          python3 tests/test_zero_launcher.py
          "$pkg/zero-launcher.sh" --list
          "$pkg/zero-launcher.sh" --check || true
      - uses: actions/upload-artifact@v4
        with:
          name: inferzero-linux-x64
          path: dist/*.tar.gz
          retention-days: 14
